<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScriptForge AI – YouTube Script Writer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0f;
      color: #e5e5e5;
      min-height: 100vh;
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid #252535;
      margin-bottom: 24px;
    }
    .logo {
      width: 44px; height: 44px;
      background: rgba(139, 92, 246, 0.15);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; }
    header p { font-size: 0.78rem; color: #888; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 24px;
    }
    @media (max-width: 850px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: #12121a;
      border: 1px solid #252535;
      border-radius: 16px;
      padding: 20px;
    }
    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: #1a1a26;
      border: 1px solid #2e2e42;
      border-radius: 10px;
      padding: 11px 14px;
      color: #e5e5e5;
      font-size: 0.9rem;
      margin-bottom: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #8b5cf6;
    }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button.primary {
      width: 100%;
      background: #8b5cf6;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    button.primary:hover { background: #7c3aed; }
    button.primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .limit-box {
      background: #1a1a26;
      border: 1px solid #2e2e42;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: #aaa;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .limit-box strong { color: #a78bfa; }
    .error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    .result-section { margin-bottom: 22px; }
    .result-section h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #c4b5fd;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title-item {
      background: #1a1a26;
      border: 1px solid #2e2e42;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .script-box {
      background: #1a1a26;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 16px;
      font-size: 0.9rem;
      white-space: pre-wrap;
      line-height: 1.65;
      max-height: 520px;
      overflow-y: auto;
    }
    .script-box .section-title {
      color: #a78bfa;
      font-weight: 600;
      margin: 14px 0 6px;
    }
    .script-box .section-title:first-child { margin-top: 0; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      background: #2e2e42;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      background: #252535;
      border: 1px solid #3f3f5a;
      color: #e5e5e5;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover { background: #2e2e42; }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #a78bfa;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2e2e42;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #22c55e;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🎬</div>
      <div>
        <h1>ScriptForge AI</h1>
        <p>YouTube Script Writer • Free</p>
      </div>
    </header>

    <div class="grid">
      <!-- Form -->
      <div class="card">
        <h2>✨ Create Script</h2>

        <div class="limit-box">
          <span>Daily limit</span>
          <strong id="limitText">3 left today</strong>
        </div>

        <form id="scriptForm">
          <label>Video Topic *</label>
          <textarea id="topic" placeholder="e.g. How I make $5k/month with AI tools in 2026" required></textarea>

          <label>Target Audience</label>
          <input id="audience" placeholder="e.g. Beginner YouTubers, 18-30" />

          <div class="row">
            <div>
              <label>Length</label>
              <select id="length">
                <option>YouTube Shorts (≤60s)</option>
                <option>3-5 minutes</option>
                <option selected>8-12 minutes</option>
                <option>15-20 minutes</option>
                <option>20+ minutes</option>
              </select>
            </div>
            <div>
              <label>Language</label>
              <select id="language">
                <option>English</option>
                <option>Hindi</option>
                <option>Spanish</option>
                <option>Portuguese</option>
                <option>French</option>
                <option>German</option>
              </select>
            </div>
          </div>

          <label>Tone</label>
          <select id="tone">
            <option>Entertaining & Informative</option>
            <option>Educational / Calm</option>
            <option>Motivational & High Energy</option>
            <option>Storytelling</option>
            <option>Casual & Conversational</option>
            <option>Professional</option>
          </select>

          <label>Style</label>
          <select id="style">
            <option>Talking Head</option>
            <option>Faceless / Voiceover</option>
            <option>Tutorial / Screen Recording</option>
            <option>Vlog Style</option>
            <option>Documentary Style</option>
          </select>

          <button type="submit" class="primary" id="generateBtn">
            ✨ Generate Full Package
          </button>
        </form>

        <div id="errorBox" class="error" style="display:none;"></div>
      </div>

      <!-- Result -->
      <div class="card" id="resultCard">
        <div id="emptyState" class="empty">
          <div class="icon">🎥</div>
          <p>Your script package will appear here</p>
          <p style="font-size:0.85rem;margin-top:6px;">Fill the form and click Generate</p>
        </div>

        <div id="loadingState" class="loading" style="display:none;">
          <div class="spinner"></div>
          <p>Generating your script package...</p>
          <p style="font-size:0.8rem;color:#888;margin-top:6px;">This may take 10-20 seconds</p>
        </div>

        <div id="resultContent" style="display:none;">
          <!-- Titles -->
          <div class="result-section">
            <h3>📌 Title Options</h3>
            <div id="titlesBox"></div>
          </div>

          <!-- Description -->
          <div class="result-section">
            <h3>📝 Description</h3>
            <div class="script-box" id="descriptionBox" style="max-height:180px;"></div>
          </div>

          <!-- Tags -->
          <div class="result-section">
            <h3>🏷️ Tags</h3>
            <div class="tags" id="tagsBox"></div>
          </div>

          <!-- Script -->
          <div class="result-section">
            <h3>📜 Full Script</h3>
            <div class="script-box" id="scriptBox"></div>
          </div>

          <div class="actions">
            <button class="btn" onclick="copyAll()">📋 Copy All</button>
            <button class="btn" onclick="downloadScript()">⬇️ Download .txt</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied!</div>

  <script>
    const DAILY_LIMIT = 3;
    const STORAGE_KEY = 'scriptforge_usage';

    function getToday() {
      return new Date().toISOString().slice(0, 10);
    }

    function getUsage() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (data.date !== getToday()) {
          return { date: getToday(), count: 0 };
        }
        return data;
      } catch {
        return { date: getToday(), count: 0 };
      }
    }

    function saveUsage(count) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        date: getToday(),
        count
      }));
    }

    function updateLimitUI() {
      const usage = getUsage();
      const left = Math.max(0, DAILY_LIMIT - usage.count);
      document.getElementById('limitText').textContent = left + ' left today';
      document.getElementById('generateBtn').disabled = left <= 0;
      if (left <= 0) {
        document.getElementById('generateBtn').textContent = 'Daily limit reached';
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    document.getElementById('scriptForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const usage = getUsage();
      if (usage.count >= DAILY_LIMIT) {
        showError('You have reached your daily limit of 3 scripts. Come back tomorrow!');
        return;
      }

      const payload = {
        topic: document.getElementById('topic').value.trim(),
        audience: document.getElementById('audience').value.trim(),
        length: document.getElementById('length').value,
        tone: document.getElementById('tone').value,
        style: document.getElementById('style').value,
        language: document.getElementById('language').value
      };

      if (!payload.topic) {
        showError('Please enter a video topic.');
        return;
      }

      // UI states
      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('resultContent').style.display = 'none';
      document.getElementById('loadingState').style.display = 'block';
      document.getElementById('generateBtn').disabled = true;
      document.getElementById('generateBtn').textContent = 'Generating...';

      try {
        const res = await fetch("/api/generate", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Generation failed');
        }

        // Success – update usage
        saveUsage(usage.count + 1);
        updateLimitUI();

        // Render result
        renderResult(data);
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('resultContent').style.display = 'block';

      } catch (err) {
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('emptyState').style.display = 'block';
        showError(err.message || 'Something went wrong. Please try again.');
        updateLimitUI();
      }
    });

    let lastResult = null;

    function renderResult(data) {
      lastResult = data;

      // Titles
      const titlesBox = document.getElementById('titlesBox');
      titlesBox.innerHTML = '';
      (data.titles || []).forEach((t, i) => {
        const div = document.createElement('div');
        div.className = 'title-item';
        div.innerHTML = `<span>${i + 1}. ${t}</span>
          <button class="btn" style="padding:4px 10px;font-size:0.75rem;" onclick="navigator.clipboard.writeText('${t.replace(/'/g, "\\'")}').then(()=>showToast('Title copied'))">Copy</button>`;
        titlesBox.appendChild(div);
      });

      // Description
      document.getElementById('descriptionBox').textContent = data.description || '';

      // Tags
      const tagsBox = document.getElementById('tagsBox');
      tagsBox.innerHTML = '';
      (data.tags || []).forEach(tag => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = tag;
        tagsBox.appendChild(span);
      });

      // Script
      const script = data.script || {};
      let html = '';
      if (script.hook) html += `<div class="section-title">🎣 HOOK</div>${script.hook}\n\n`;
      if (script.intro) html += `<div class="section-title">👋 INTRO</div>${script.intro}\n\n`;
      if (script.sections && script.sections.length) {
        script.sections.forEach(sec => {
          html += `<div class="section-title">📌 ${sec.timestamp || ''} – ${sec.title || 'Section'}</div>${sec.content}\n\n`;
        });
      }
      if (script.cta) html += `<div class="section-title">📢 CALL TO ACTION</div>${script.cta}\n\n`;
      if (script.outro) html += `<div class="section-title">👋 OUTRO</div>${script.outro}`;

      document.getElementById('scriptBox').innerHTML = html;
    }

    function copyAll() {
      if (!lastResult) return;
      const s = lastResult.script || {};
      let text = '=== TITLES ===\n';
      (lastResult.titles || []).forEach((t, i) => text += `${i + 1}. ${t}\n`);
      text += '\n=== DESCRIPTION ===\n' + (lastResult.description || '') + '\n';
      text += '\n=== TAGS ===\n' + (lastResult.tags || []).join(', ') + '\n\n';
      text += '=== SCRIPT ===\n\n';
      if (s.hook) text += 'HOOK:\n' + s.hook + '\n\n';
      if (s.intro) text += 'INTRO:\n' + s.intro + '\n\n';
      if (s.sections) {
        s.sections.forEach(sec => {
          text += `${sec.timestamp || ''} ${sec.title || ''}:\n${sec.content}\n\n`;
        });
      }
      if (s.cta) text += 'CTA:\n' + s.cta + '\n\n';
      if (s.outro) text += 'OUTRO:\n' + s.outro;

      navigator.clipboard.writeText(text).then(() => showToast('Everything copied!'));
    }

    function downloadScript() {
      if (!lastResult) return;
      const s = lastResult.script || {};
      let text = '=== TITLES ===\n';
      (lastResult.titles || []).forEach((t, i) => text += `${i + 1}. ${t}\n`);
      text += '\n=== DESCRIPTION ===\n' + (lastResult.description || '') + '\n';
      text += '\n=== TAGS ===\n' + (lastResult.tags || []).join(', ') + '\n\n';
      text += '=== SCRIPT ===\n\n';
      if (s.hook) text += 'HOOK:\n' + s.hook + '\n\n';
      if (s.intro) text += 'INTRO:\n' + s.intro + '\n\n';
      if (s.sections) {
        s.sections.forEach(sec => {
          text += `${sec.timestamp || ''} ${sec.title || ''}:\n${sec.content}\n\n`;
        });
      }
      if (s.cta) text += 'CTA:\n' + s.cta + '\n\n';
      if (s.outro) text += 'OUTRO:\n' + s.outro;

      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'youtube-script.txt';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloaded!');
    }

    // Init
    updateLimitUI();
  </script>
</body>
</html>
